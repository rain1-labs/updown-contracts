[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.29"
via_ir = true
optimizer = true
optimizer_runs = 200
# Deploy.s.sol writes a JSON deployment record here (vm.writeJson). Scoped to
# this one directory so scripts cannot touch anything else on disk.
fs_permissions = [{ access = "write", path = "./deployments" }]

[profile.default.fmt]
line_length = 120

# `forge build` runs the linter. Every finding that survives here would be a real
# production-code defect, so the two escape hatches below are deliberately narrow
# and everything else is fixed at the source (or justified with an inline
# `forge-lint: disable-next-line(...)` comment explaining why the cast is safe).
[lint]
# Lint the deployed contracts only. Test fixtures and the deploy script build
# malformed reports and hand-scaled fee maths on purpose — unchecked timestamp
# casts and floor-to-boundary integer division are the point of those files, not
# a defect, and annotating ~60 fixture lines would bury the signal from `src/`.
# (the glob must reach the file itself — a bare `test/**` matches nothing here.)
ignore = ["test/**/*.sol", "script/**/*.sol"]
# Style-only lints that conflict with conventions we cannot change:
#   screaming-snake-case-immutable — our immutables are `public`, so their names
#     are ABI getters (`usdt()`, `resolver()`, `verifierProxy()`, ...) that the
#     bot, frontend and deployment records already bind to. Renaming is a
#     breaking ABI change to audited, deployed contracts.
#   mixed-case-function — `IVerifierProxy` / `MockVerifierProxy` mirror
#     Chainlink's deployed ABI (`s_feeManager()`), where the name IS the
#     selector; renaming would call into nothing.
#   asm-keccak256, unwrapped-modifier-logic — gas / code-size micro-rewrites of
#     audited code paths. Not worth re-opening the audit surface over.
exclude_lints = [
    "screaming-snake-case-immutable",
    "mixed-case-function",
    "asm-keccak256",
    "unwrapped-modifier-logic",
]

# Gate 3 real-DON fork test only. Inherits the default profile's compiler
# settings and adds `ffi = true` so `UpDownForkTest` can shell out to
# `script/fetch_streams_report.mjs`. Kept OUT of the default profile so the
# audited CI suite never runs with ffi enabled.
#   FOUNDRY_PROFILE=fork forge test --match-contract UpDownForkTest -vvv
[profile.fork]
ffi = true

[rpc_endpoints]
arbitrum = "${ARBITRUM_RPC_URL}"

# Arbiscan verification. `hardhat.config.js` used to hold this key; that file is
# gone, so without this section `forge script --verify` fails after the contracts
# are already broadcast. Both dev and prod are chain 42161, so one entry serves
# both. The key is read from the environment — never inline it here.
[etherscan]
arbitrum = { key = "${ARBISCAN_API_KEY}", chain = 42161 }
